name: Keep Render awake

# Free Render web services hibernate after ~15 min idle, and the next
# connection then pays a ~30-50s cold start. This workflow pings the
# production server's /health endpoint so it never sits idle that long.
#
# WHY THIS IS A LOOP, NOT ONE PING PER TRIGGER
#
# GitHub's scheduled cron is best-effort, and for a high-frequency schedule
# "best-effort" means most triggers are simply dropped. Measured on this
# repo over 10 hours with a */10 cron:
#
#   delivered 18 of ~60 expected runs (30%)
#   gaps between runs: min 26 min, average 33 min, max 52 min
#
# Every single gap was longer than Render's ~15 min idle window, so the
# previous one-ping-per-run version never actually kept anything awake.
# Asking for a tighter cron does not help — GitHub is already ignoring the
# one we have. Instead each run now pings for the better part of an hour,
# which covers the worst observed gap on its own.
#
# INSTANCE HOURS — read before widening the window
#
# Render's free tier grants ~750 instance-hours/month across the workspace,
# and a 31-day month is 744 hours. A service kept genuinely warm 24/7
# consumes essentially the entire allowance, leaving nothing for
# dtc-server-staging and risking a suspension near the end of the month.
# So ACTIVE_HOURS_UTC defaults to an 18h/day window (~558h/month), leaving
# real headroom. Override it with a KEEP_ALIVE_HOURS_UTC repo variable:
#   "11-05"  the default — 08:00-02:00 in BRT (UTC-3), the hours people play
#   "0-24"   always on — only do this if nothing else uses the free tier
#
# Setup: add a repo variable RENDER_HEALTH_URL (Settings -> Secrets and
# variables -> Actions -> Variables), e.g. https://dtc-server.onrender.com/health
#
# Still a caveat: GitHub disables scheduled workflows after 60 days with no
# repo activity. For rock-solid warmth, pair this with an external pinger
# (UptimeRobot / cron-job.org), which has neither the throttling nor the
# 60-day rule.

on:
  schedule:
    # Ask often. GitHub will drop most of these, and that is fine — each run
    # that does land covers ~55 minutes on its own, so a delivery rate as
    # low as one per hour still leaves no meaningful hole.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      duration_min:
        description: 'Minutes to keep pinging (short values are for testing)'
        required: false
        default: '55'
      ignore_active_hours:
        description: 'Ping even outside the active-hours window'
        type: boolean
        required: false
        default: false

# One warm-up loop at a time. A newly delivered schedule supersedes the run
# in flight — cancelled runs here are the design working, not a failure.
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # a little over the 55 min loop, so a hung curl cannot pin the runner
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Keep the server warm
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
          DURATION_MIN: ${{ inputs.duration_min || '55' }}
          INTERVAL_MIN: '5'
          # '0-24' rather than '' for "always on": an empty string is falsy
          # in a GitHub expression, so `x && '' || y` would fall straight
          # through to y and silently keep the window it was asked to ignore.
          ACTIVE_HOURS_UTC: ${{ inputs.ignore_active_hours && '0-24' || vars.KEEP_ALIVE_HOURS_UTC || '11-05' }}
        run: bash .github/scripts/keep-warm.sh
